<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NVIDIA (NVDA)">
  <!-- NVIDIA eye mark: lens-shaped eye with curved upper lid and central iris dot.
       Recreated from first principles; not a pixel-trace of any third-party asset. -->
  <g>
    <!-- Lens / eye outline (almond shape) -->
    <path d="M2 32
             C8 18 19 11 32 11
             C45 11 56 18 62 32
             C56 46 45 53 32 53
             C19 53 8 46 2 32 Z"
          fill="#76B900"/>

    <!-- Inner dark cutout (iris area) -->
    <path d="M10 32
             C14 22 22 17 32 17
             C42 17 50 22 54 32
             C50 42 42 47 32 47
             C22 47 14 42 10 32 Z"
          fill="#0E0E10"/>

    <!-- Central highlight (small bright dot, NVIDIA eye's white point) -->
    <ellipse cx="28" cy="28" rx="3.2" ry="2.2" fill="#76B900"/>
  </g>
</svg>
